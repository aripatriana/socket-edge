# Cluster configuration section.
# Defines how this node participates in a high-availability cluster.
#
# The cluster is responsible for:
# - Node discovery and membership
# - Master / slave role election
# - Failover coordination

cluster {

  # Logical name of the cluster.
  # All nodes with the same cluster-name will form one cluster.
  cluster-name = "socket-edge-cluster"

  # Absolute path to JGroups configuration file.
  # This file defines transport, discovery, and failure detection.
  jgroup-path = "/conf/jgroups.xml"

  # Role configuration for this node.
  # Controls how the node behaves during cluster startup and election.
  role {

    # Preferred role for this node.
    #
    # Supported values:
    # - master : node prefers to become MASTER
    # - slave  : node prefers to become SLAVE
    # - auto   : role is determined dynamically by election
    prefer = master

    # Strict role enforcement flag.
    #
    # true  : if preferred role is master and a master already exists,
    #         the node startup will fail
    # false : node will automatically fall back to slave role
    strict = false
  }

  # Static list of cluster member addresses.
  # Used for initial discovery and bootstrap.
  members = [
    "13.131.9.162",
    "13.131.9.166"
  ]

  # JGroups-specific network configuration.
  # Used for cluster communication and role election.
  jgroup = {

    # Local bind address for JGroups communication.
    # Must match the network interface of this node.
    bind-addr = "13.131.9.162"

    # JGroups communication port.
    port = 7800
  }

  # Hazelcast configuration.
  # Used for distributed data structures and coordination.
  hazelcast = {

    # Hazelcast member port.
    port = 5701
  }
}
