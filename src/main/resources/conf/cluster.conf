# ============================================================================
# Socket Edge v3.0 — Cluster Configuration
# ============================================================================
#
# Defines how this node participates in a high-availability cluster.
#
# The cluster provides:
#   - Node discovery and membership via JGroups
#   - MASTER / SLAVE role election
#   - Distributed correlation cache via Hazelcast
#   - Failover coordination and split-brain protection
#
# This file is only loaded when server.mode = cluster.
# Environment variable substitution supported: ${ENV_VAR}
# ============================================================================

cluster {

    # Logical cluster name.
    # All nodes with the same name form one cluster.
    # Use distinct names to isolate environments (e.g. "se-prod", "se-uat").
    cluster-name = "socket-edge-cluster"

    # Path to JGroups configuration file (relative to base.dir).
    jgroup-path = "/conf/jgroups.xml"


    # --- Role Election ---
    role {
        # Preferred role for this node.
        # Supported:
        #   master - node prefers to become MASTER
        #   slave  - node prefers to become SLAVE
        #   auto   - role determined dynamically by JGroups coordinator election
        prefer = master

        # Strict role enforcement.
        #   true  - if prefer=master and a master already exists, node will FAIL to start
        #   false - node automatically falls back to slave
        # Use strict=true only for controlled maintenance (e.g. forcing a specific node as master).
        strict = false
    }


    # --- Cluster Members ---
    # Static list of all node IP addresses for initial discovery.
    # Must include this node's own address.
    # Both JGroups and Hazelcast use this list for bootstrap.
    members = [
        "13.131.9.162",
        "13.131.9.166"
    ]


    # --- JGroups ---
    # Transport layer for cluster communication and leader election.
    jgroup {
        # Local bind address for JGroups.
        # Must match one of this node's network interfaces.
        # In production, use the private/management network interface.
        bind-addr = "13.131.9.162"

        # JGroups communication port.
        # Ensure this port (+port_range in jgroups.xml) is open in firewall.
        port = 7800
    }


    # --- Hazelcast ---
    # Distributed data grid for correlation cache and shared state.
    hazelcast {
        # Hazelcast member port.
        # Ensure open in firewall between all cluster members.
        port = 5701

        # Network interface for Hazelcast communication.
        # If empty, Hazelcast will auto-detect.
        # Set explicitly in multi-NIC environments.
        network-interface = ""

        # Number of synchronous backups for correlation store map.
        # 1 = data is replicated to one other node (recommended for 2-node clusters).
        # 0 = no backup, faster but data lost on node failure.
        map-backup-count = 1

        # Number of asynchronous backups (in addition to sync backups).
        # Async backups don't block the write operation.
        map-async-backup-count = 0
    }


    # --- Failover ---
    # Controls behavior during node failure and recovery.
    failover {
        # Failover timeout in milliseconds.
        # How long the cluster waits after detecting a failed MASTER
        # before promoting a SLAVE to MASTER.
        # Lower = faster failover, but more sensitive to network blips.
        # Higher = more tolerant of transient issues, but longer downtime.
        failover-timeout = 5000

        # Split-brain resolution policy.
        # What happens when network partition causes multiple nodes
        # to each think they are MASTER.
        # Supported:
        #   keep-oldest    - the node that has been MASTER longest wins;
        #                    other masters demote to SLAVE
        #   keep-majority  - the partition with more members keeps MASTER;
        #                    minority partition demotes all to SLAVE
        #   shutdown-minority - minority partition shuts down entirely
        #                       (safest for financial systems)
        split-brain-policy = "keep-oldest"

        # Minimum number of cluster members required for the cluster
        # to be considered valid and operational.
        # If member count drops below this number:
        #   - No new MASTER election will occur
        #   - Existing MASTER continues to operate (degrade gracefully)
        # Set to 1 for single-node tolerance (not recommended for production).
        # Set to 2 for 2-node clusters (standard).
        quorum-size = 1
    }
}
