# ============================================================================
# Socket Edge v3.0 — System Configuration
# ============================================================================
#
# Root namespace: system { ... }
# Consistent with cluster.conf which uses: cluster { ... }
#
# Full config path example: system.server.http.port = 9001
#
# Environment variable substitution supported: ${ENV_VAR}
# ============================================================================

system {

    # ------------------------------------------------------------------------
    # SERVER
    # HTTP admin server and default TCP socket parameters.
    # ------------------------------------------------------------------------
    server {

        # Logical name of this node.
        name = socket-edge

        # --- HTTP Admin API ---

        http {
            port = 9001

            # Bind address. Use 127.0.0.1 for localhost only.
            bind-address = "127.0.0.1"

            # Idle timeout for HTTP connections (ms).
            idle-timeout = 30000

            # Authentication mode: none | basic
            auth {
                mode = none

                # For basic auth. In production use env vars:
                #   username = ${HTTP_AUTH_USER}
                #   password = ${HTTP_AUTH_PASSWORD}
                username = "admin"
                password = "changeit"
            }
        }

        # --- Default TCP Socket Parameters ---
        # Applied to all channels unless overridden in channel.conf.

        tcp {
            # Max ISO 8583 frame size (bytes). Rejects oversized frames.
            max-frame-length = 8192

            # Channel idle timeout (seconds). 0 = disabled.
            idle-timeout = 300

            # Socket buffer sizes (bytes). 0 = OS default.
            so-rcvbuf = 0
            so-sndbuf = 0

            # TCP keepalive.
            so-keepalive = true

            # TCP_NODELAY (disable Nagle). Recommended for ISO 8583.
            tcp-nodelay = true

            # Client socket connect timeout (ms).
            connect-timeout = 5000
        }
    }

    # ------------------------------------------------------------------------
    # MESSAGE
    # ISO 8583 packager configuration.
    # ------------------------------------------------------------------------
    message {

        standard = iso8583

        packager {
            # Path to packager XML (relative to base.dir).
            path = "/conf/iso87ascii.xml"

            # Primary key field for MTI identification.
            key = "de1"
        }
    }

    # ------------------------------------------------------------------------
    # ENGINE
    # Processing pipeline, cache, and lifecycle.
    # ------------------------------------------------------------------------
    engine {

        # --- Correlation Cache ---
        # Auto-selected: standalone = Caffeine, cluster = Hazelcast.
        cache {
            # Entry TTL (ms). Match or exceed downstream response time.
            ttl = 60000

            # Max entries for in-memory cache (standalone only).
            # Safety bound to prevent OOM. ~200 bytes/entry, 500K ≈ 100MB.
            # 0 = default (500000). Ignored in cluster mode.
            max-size = 500000
        }

        # --- SEDA Pipeline ---
        seda {
            receive {
                consumers = 8
                queue-size = 5000
                block-when-full = true
            }
            inbound {
                consumers = 8
                queue-size = 5000
                block-when-full = true
            }
            outbound {
                consumers = 8
                queue-size = 5000
                block-when-full = true
            }
        }

        # --- Lifecycle ---
        lifecycle {
            # Drain timeout (ms). Wait for inflight messages before shutdown.
            drain-timeout = 30000

            # Grace period (ms) after drain for final cleanup.
            shutdown-grace-period = 5000
        }

        # --- Metrics ---
        metrics {
            # Exporter: simple | jmx | prometheus
            exporter = "simple"
            prometheus-port = 9090
            jmx-domain = "socket.edge"
        }

        # --- Health Probes ---
        health {
            liveness-path = "/health/live"
            readiness-path = "/health/ready"

            # Startup probe delay (ms). Probes return 503 during this window.
            startup-probe-delay = 10000
        }
    }

    # ------------------------------------------------------------------------
    # LOGGING
    # PCI-DSS compliance and audit trail.
    # ------------------------------------------------------------------------
    logging {

        # --- PCI Field Masking ---
        pci {
            enabled = true

            # Fields to mask: PAN, expiry, track data, PIN.
            mask-fields = ["de2", "de14", "de35", "de36", "de52"]

            # Strategy: partial (first6/last4) | full (****)
            mask-strategy = "partial"
        }

        # --- Audit Trail ---
        audit {
            enabled = false

            # JSON-lines format for ELK/Splunk.
            path = "/logs/audit.jsonl"

            fields = ["mti", "correlation-key", "channel", "direction", "timestamp", "latency-ns"]
        }
    }
}
