# ============================================================================
# Socket Edge v3.0 — System Configuration
# ============================================================================
#
# This file defines the core runtime behavior of the Socket Edge engine.
#
# Configuration sections:
#   server    - HTTP admin server and TCP socket defaults
#   message   - ISO 8583 packager definition
#   engine    - Processing pipeline, cache, and lifecycle
#   logging   - PCI-DSS field masking and audit trail
#
# Loaded by Typesafe Config. Only single-line comments (#) are supported.
# Environment variable substitution supported: ${ENV_VAR}
# ============================================================================


# ----------------------------------------------------------------------------
# SERVER
# HTTP admin server and default TCP socket parameters.
# ----------------------------------------------------------------------------
server {

    # Logical name of this node.
    # Used in logging, metrics tags, and cluster identification.
    name = socket-edge

    # --- HTTP Admin API ---

    http {
        # TCP port for the admin HTTP server.
        port = 9001

        # Bind address for the HTTP server.
        # Use 127.0.0.1 to restrict access to localhost only.
        # Use 0.0.0.0 to listen on all interfaces (not recommended in production).
        bind-address = "127.0.0.1"

        # Idle timeout for HTTP connections in milliseconds.
        # Connections with no activity beyond this duration will be closed.
        idle-timeout = 30000

        # HTTP authentication mode.
        # Supported: none, basic
        #   none  : no authentication (development only)
        #   basic : HTTP Basic Authentication
        auth {
            mode = none

            # Credentials for basic auth (only used when mode = basic).
            # In production, use environment variable substitution:
            #   username = ${HTTP_AUTH_USER}
            #   password = ${HTTP_AUTH_PASSWORD}
            username = "admin"
            password = "changeit"
        }
    }

    # --- Default TCP Socket Parameters ---
    # These values apply to all TCP channels unless overridden in channel.conf.

    tcp {
        # Maximum ISO 8583 message frame size in bytes.
        # Messages exceeding this size will be rejected.
        # Typical ISO 8583 messages are 512-2048 bytes.
        # Set higher (e.g. 16384) if your institution uses extended fields.
        max-frame-length = 8192

        # Socket idle timeout in seconds.
        # Channels with no read/write activity beyond this duration
        # will be closed and reconnected (client) or released (server).
        # Set to 0 to disable idle timeout.
        idle-timeout = 300

        # TCP socket receive buffer size in bytes.
        # Tune based on network bandwidth and latency.
        # Set to 0 to use OS default.
        so-rcvbuf = 0

        # TCP socket send buffer size in bytes.
        so-sndbuf = 0

        # Enable TCP keepalive.
        so-keepalive = true

        # Enable TCP_NODELAY (disable Nagle algorithm).
        # Recommended for low-latency ISO 8583 processing.
        tcp-nodelay = true

        # Connection timeout in milliseconds for client sockets.
        connect-timeout = 5000
    }
}


# ----------------------------------------------------------------------------
# MESSAGE
# ISO 8583 message standard and packager configuration.
# ----------------------------------------------------------------------------
message {

    # Message standard. Currently supported: iso8583
    standard = iso8583

    packager {
        # Path to ISO 8583 XML packager definition (relative to base.dir).
        path = "/conf/iso87ascii.xml"

        # Primary key field for message type identification.
        # Typically "de1" which maps to MTI (Message Type Indicator).
        key = "de1"
    }
}


# ----------------------------------------------------------------------------
# ENGINE
# Internal processing pipeline, cache, and lifecycle management.
# ----------------------------------------------------------------------------
engine {

    # --- Correlation Cache ---
    # Stores request-response mapping for asynchronous ISO 8583 flows.
    cache {
        # Cache implementation type.
        # Supported:
        #   INMEMORY   - JVM heap-based (single node / active-passive)
        #   HAZELCAST  - distributed (auto-selected in cluster mode, overrides this value)
        type = "INMEMORY"

        # Cache entry TTL in milliseconds.
        # Entries not matched within this window will be evicted.
        # Should match or exceed max expected response time from downstream.
        ttl = 60000
    }

    # --- SEDA Pipeline ---
    # Staged Event-Driven Architecture configuration.
    # Each stage has its own thread pool and bounded queue.
    seda {

        # Receive stage — first stage after socket accepts a message.
        receive {
            consumers = 8
            queue-size = 5000
            block-when-full = true
        }

        # Inbound stage — validation, routing, forwarding to downstream.
        inbound {
            consumers = 8
            queue-size = 5000
            block-when-full = true
        }

        # Outbound stage — response routing back to originator.
        outbound {
            consumers = 8
            queue-size = 5000
            block-when-full = true
        }
    }

    # --- Lifecycle ---
    # Controls graceful shutdown behavior.
    lifecycle {
        # Drain timeout in milliseconds.
        # During shutdown, the engine waits this long for inflight
        # messages to complete before force-closing connections.
        # Set to 0 for immediate shutdown (not recommended).
        drain-timeout = 30000

        # Grace period in milliseconds after drain.
        # Allows final cleanup: flush logs, close files, deregister metrics.
        shutdown-grace-period = 5000
    }

    # --- Metrics ---
    metrics {
        # Exporter type.
        # Supported:
        #   simple      - in-memory only (SimpleMeterRegistry)
        #   jmx         - expose via JMX MBeans
        #   prometheus  - expose HTTP /metrics endpoint for Prometheus scraping
        exporter = "simple"

        # Port for Prometheus metrics endpoint (only when exporter = prometheus).
        prometheus-port = 9090

        # JMX domain prefix (only when exporter = jmx).
        jmx-domain = "socket.edge"
    }

    # --- Health Probes ---
    # For orchestrators: Kubernetes, Docker Swarm, systemd, etc.
    health {
        # Liveness: returns 200 if JVM and engine are alive.
        liveness-path = "/health/live"

        # Readiness: returns 200 only when at least one socket is ACTIVE.
        readiness-path = "/health/ready"

        # Startup probe delay in milliseconds.
        # Probes return 503 during this window to allow connections to establish.
        startup-probe-delay = 10000
    }
}


# ----------------------------------------------------------------------------
# LOGGING
# PCI-DSS compliance and audit trail configuration.
# ----------------------------------------------------------------------------
logging {

    # --- PCI Field Masking ---
    # ISO 8583 fields containing sensitive cardholder data.
    # Masked in ALL log output (application logs, audit trail, error logs).
    pci {
        # Enable/disable PCI field masking globally.
        enabled = true

        # Fields to mask in log output.
        # de2  = Primary Account Number (PAN)
        # de14 = Date Expiration
        # de35 = Track 2 Data
        # de36 = Track 3 Data
        # de52 = PIN Data (encrypted)
        mask-fields = ["de2", "de14", "de35", "de36", "de52"]

        # Masking strategy.
        #   partial  - show first 6 and last 4: "123456****5678"
        #   full     - replace entire value: "****"
        mask-strategy = "partial"
    }

    # --- Audit Trail ---
    # Structured log of all message routing decisions.
    audit {
        enabled = false

        # Audit log file path (relative to base.dir).
        # Format: JSON-lines (.jsonl) for easy parsing by ELK/Splunk.
        path = "/logs/audit.jsonl"

        # Fields to include in each audit entry.
        fields = ["mti", "correlation-key", "channel", "direction", "timestamp", "latency-ns"]
    }
}
