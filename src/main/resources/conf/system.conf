# This is the main system configuration file.
# It defines the core runtime behavior of the Socket Edge ISO8583 engine.
#
# The configuration includes:
# - Socket server settings
# - Message and ISO8583 packager definition
# - Internal processing engine, cache, and queues
#
# This file is loaded by a TypeScript-based configuration loader.
# Only single-line comments are supported.

server {
    # Defines the logical name of the socket server.
    # This name is used for logging, monitoring, and node identification.
    name = socket-edge

    # Specifies the TCP port on which the server listens for connections.
    # Ensure this port is allowed by firewall and security rules.
    port = 9001
}

# Message configuration section.
# Defines message standard and ISO8583 packager behavior.
message {

  # Specifies the message standard used by the system.
  # Currently supported: iso8583
  standard = iso8583

  # Packager configuration for ISO message parsing and construction.
  packager {

    # Absolute path to the ISO8583 XML packager definition file.
    # This file defines field structure, length, and encoding.
    path = "/conf/iso87ascii.xml"

    # Primary key used to identify and correlate messages.
    key  = "de1"
  }
}

# Engine configuration section.
# Controls internal processing pipeline and temporary caching.
engine {

  # Cache configuration.
  # Used to store temporary processing context and message correlation data.
  cache {

    # Cache implementation type.
    # INMEMORY uses JVM heap-based storage.
    type = "INMEMORY"

    # Cache entry time-to-live (TTL) in milliseconds.
    ttl = 60000
  }

  # SEDA (Staged Event-Driven Architecture) configuration.
  # Defines asynchronous internal processing stages.
  seda {

    # Receive stage.
    # First stage after the socket accepts a message.
    receive {

      # Number of worker threads processing received messages.
      consumers = 8

      # Maximum number of messages allowed in the receive queue.
      queue-size = 5000

      # When true, producer threads are blocked when the queue is full.
      block-when-full = true
    }

    # Inbound stage.
    # Handles core business processing such as validation and routing.
    inbound {

      consumers = 8
      queue-size = 5000
      block-when-full = true
    }

    # Outbound stage.
    # Final stage before sending response back to the client.
    outbound {

      consumers = 8
      queue-size = 5000
      block-when-full = true
    }
  }
}
