# ============================================================================
# Socket Edge v3.0 — Channel Configuration
# ============================================================================
#
# Defines TCP channels and ISO 8583 profiles.
#
# A channel pairs one server socket (inbound) with one or more
# client sockets (outbound). Each channel references one or more
# profiles that define which MTIs it handles and how to correlate
# request-response pairs.
#
# Multiple profiles per channel allow different correlation strategies
# per message type (e.g. financial messages use 5-field correlation,
# network messages use STAN only).
# ============================================================================


# ----------------------------------------------------------------------------
# CHANNEL: fello
# ----------------------------------------------------------------------------
channel {
    name fello
    type tcp

    server {
        listen 127.0.0.1 27000
        pool 127.0.0.1
    }

    client {
        connect 127.0.0.1 26000 weight 100 priority 0 maxfails 3 failtimeout 30
        strategy roundrobin
    }

    # Multiple profiles — engine resolves which profile handles each MTI.
    # MTI must not overlap across profiles in the same channel.
    profile financial, network

    # What happens when an unrecognized MTI arrives.
    # reject = drop message + log warning (default)
    unknown-mti = reject
}


# ----------------------------------------------------------------------------
# PROFILE: financial
# Handles authorization, financial, reversal, and advice messages.
# ----------------------------------------------------------------------------
profile financial {

    direction inbound {
        # Authorization
        de1 in ["0100"]

        # Financial (purchase, cash advance, etc.)
        de1 in ["0200"]

        # Advice (financial confirmation)
        de1 in ["0220", "0221"]

        # Reversal
        de1 in ["0400", "0420", "0421"]
    }

    direction outbound {
        # Authorization response
        de1 in ["0110"]

        # Financial response
        de1 in ["0210"]

        # Advice response
        de1 in ["0230"]

        # Reversal response
        de1 in ["0410", "0430"]
    }

    # Correlation fields for matching request ↔ response.
    # All fields must be present in both request and response messages.
    #
    # de2  = Primary Account Number (PAN)
    # de11 = Systems Trace Audit Number (STAN)
    # de37 = Retrieval Reference Number (RRN)
    # de12 = Time, Local Transaction
    # de13 = Date, Local Transaction
    correlation {
        de2
        de11
        de37
        de12
        de13
    }
}


# ----------------------------------------------------------------------------
# PROFILE: network
# Handles network management messages (echo, sign-on/off, key exchange).
# Uses minimal correlation (STAN only) since network messages
# typically don't carry PAN or RRN.
# ----------------------------------------------------------------------------
profile network {

    direction inbound {
        # Echo test / network management
        de1 in ["0800"]
    }

    direction outbound {
        # Echo response
        de1 in ["0810"]
    }

    # Network messages only need STAN for correlation.
    # de11 = Systems Trace Audit Number (STAN)
    correlation {
        de11
    }
}
